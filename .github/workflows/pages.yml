name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # edit_date and author come from git history
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Score (fall back to offline if GBIF fails)
        run: uv run python scripts/score.py || uv run python scripts/score.py --offline
      - name: Expertise (offline if APIs fail)
        env:
          RANGECRAFT_MAILTO: ${{ vars.RANGECRAFT_MAILTO }}
        run: uv run python scripts/expertise.py || uv run python scripts/expertise.py --offline
      - name: Agreement map (contributors only)
        run: uv run python scripts/consensus.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
